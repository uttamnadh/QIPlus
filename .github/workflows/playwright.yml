name: Playwright E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      project:
        description: 'Test Project / Suite to run'
        required: true
        default: 'positive'
        type: choice
        options:
          - positive
          - negative
          - regression
          - all

jobs:
  test:
    name: Run E2E Test Suite
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: |
          if [ "${{ github.event.inputs.project }}" = "all" ]; then
            npx playwright test
          elif [ -n "${{ github.event.inputs.project }}" ]; then
            npx playwright test --project=${{ github.event.inputs.project }}
          else
            npx playwright test --project=positive
          fi

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Setup Java for Allure Report
        uses: actions/setup-java@v4
        if: always()
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Allure Report
        if: always()
        run: |
          npm run allure:generate || true

      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
